server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://postgres:5432/identity_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/ecommerce
          jwk-set-uri: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  cookie:
    domain: ${COOKIE_DOMAIN:localhost}
    secure: ${COOKIE_SECURE:false}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800}
  services:
    profile: http://user-service:8082/users
  keycloak:
    server-url: http://keycloak:8080
    realm: ecommerce
    client-id: ecommerce
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    admin:
      username: admin
      password: admin
  google:
    callback-url: http://api-gateway:8080/api/v1/identity/auth/google/callback
    frontend-success-url: http://web-app:5173/oauth/callback
    frontend-error-url: http://web-app:5173/login
  facebook:
    callback-url: http://api-gateway:8080/api/v1/identity/auth/facebook/callback
    frontend-success-url: http://web-app:5173/oauth/callback
    frontend-error-url: http://web-app:5173/login

logging:
  level:
    com.example.identityservice: DEBUG
    org.springframework.web: INFO
