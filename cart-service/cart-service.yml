spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:postgresql://postgres:5432/cart_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/ecommerce

server:
  port: 8087

eureka:
  client:
    enabled: false

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

logging:
  level:
    com.example.cartservice: DEBUG
    org.springframework.web: INFO

