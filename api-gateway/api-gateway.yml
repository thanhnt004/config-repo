server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Tự động tạo route dựa trên Service ID (tùy chọn)
          lower-case-service-id: true
      routes:
        # --- NHÓM TÀI KHOẢN & ĐĂNG NHẬP ---
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/identity/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**

        # --- NHÓM BÁN HÀNG & SẢN PHẨM ---
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**

        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/v1/categories/**

        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/v1/cart/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**

        # --- NHÓM TIỆN ÍCH & THANH TOÁN ---
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**

        - id: banner-service
          uri: lb://BANNER-SERVICE
          predicates:
            - Path=/api/v1/banners/**

        - id: file-service
          uri: lb://FILE-SERVICE
          predicates:
            - Path=/api/v1/files/**

        - id: discount-service
          uri: lb://DISCOUNT-SERVICE
          predicates:
            - Path=/api/v1/discounts/**

        - id: discount-service-coupons
          uri: lb://DISCOUNT-SERVICE
          predicates:
            - Path=/api/v1/coupons/**

        - id: discount-service-seller-coupons
          uri: lb://DISCOUNT-SERVICE
          predicates:
            - Path=/api/v1/seller/coupons/**

        - id: discount-service-admin-coupons
          uri: lb://DISCOUNT-SERVICE
          predicates:
            - Path=/api/v1/admin/coupons/**

        - id: discount-service-admin-campaigns
          uri: lb://DISCOUNT-SERVICE
          predicates:
            - Path=/api/v1/admin/campaigns/**

        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/api/v1/search/**

        - id: chatbot-service
          uri: lb://CHATBOT-SERVICE
          predicates:
            - Path=/api/v1/chatbot/**

        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/v1/reviews/**

        - id: seller-review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/v1/seller/reviews/**

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventories/**

        - id: reservation-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/reservations/**

        - id: seller-service
          uri: lb://SELLER-SERVICE
          predicates:
            - Path=/api/v1/sellers/**

        # Seller self-management — product-service handles /api/v1/seller/products/**
        - id: seller-product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/seller/products/**

        # Seller SKU updates — product-service handles /api/v1/seller/skus/**
        - id: seller-sku-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/seller/skus/**

        # Seller option templates — product-service
        - id: seller-option-templates
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/seller/option-templates/**

        # Public option templates — product-service
        - id: option-templates
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/option-templates/**

        # Seller self-management — order-service handles /api/v1/seller/orders/**
        - id: seller-order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/seller/orders/**

        # Seller self-management — seller-service handles /api/v1/seller/** (profile, docs, bank)
        - id: seller-profile-service
          uri: lb://SELLER-SERVICE
          predicates:
            - Path=/api/v1/seller/**

        - id: seller-service-admin
          uri: lb://SELLER-SERVICE
          predicates:
            - Path=/api/v1/admin/sellers/**

        - id: user-service-admin
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/admin/users/**

        - id: banner-service-admin
          uri: lb://BANNER-SERVICE
          predicates:
            - Path=/api/v1/admin/banners/**

        - id: category-service-admin
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/v1/admin/categories/**

        - id: admin-products
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/admin/products/**

        - id: admin-option-templates
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/admin/option-templates/**

        - id: identity-service-roles
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/roles/**

        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api/v1/conversations/**
        - id: websocket-worker
          uri: ws://websocket-worker:8094
          predicates:
            - Path=/ws/**
        - id: shipping-service
          uri: lb://SHIPPING-SERVICE
          predicates:
            - Path=/api/v1/shipping/**
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    root: INFO
